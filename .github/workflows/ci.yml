name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifests and run unit tests
        run: npm test

  consumer-probe:
    # Drives this package through a REAL released OAS kernel (the one named by
    # the package's own compatibility floor) in a throwaway sandbox.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consumer probe against the released kernel
        run: npm run probe
